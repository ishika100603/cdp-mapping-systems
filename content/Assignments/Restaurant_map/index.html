<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Restaurant Seating Compliance Map</title>

    <!-- MapLibre -->
    <script src="https://unpkg.com/maplibre-gl@^5.6.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@^5.6.1/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        #legend {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 13px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        #legend div {
            display: flex;
            align-items: center;
            margin: 3px 0;
        }

        #legend span.swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>

<body>

    <div id="map"></div>
    <div id="legend">
        <strong>Seating Choice</strong>
        <div><span class="swatch" style="background:#e63946"></span> Sidewalk</div>
        <div><span class="swatch" style="background:#457b9d"></span> Roadway</div>
        <div><span class="swatch" style="background:#2a9d8f"></span> Both</div>
        <div style="margin-top:6px; font-style:italic;">Click the map to query nearby restaurants</div>
    </div>

    <script>
        // === Supabase client setup ===
        const { createClient } = window.supabase;
        const supabaseUrl = 'https://otpxsbwqpvwqtszirhqf.supabase.co';
        const supabaseKey = 'sb_publishable_nkIN1nJsP7vLv9nMUDP1Zg_24TfqBzR';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // === Base map setup ===
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
            center: [-73.98, 40.75], // NYC
            zoom: 11
        });

        // Convert query results into a GeoJSON FeatureCollection
        function toGeoJSON(rows) {
            return {
                type: "FeatureCollection",
                features: rows.map(row => ({
                    type: "Feature",
                    properties: {
                        id: row.RestaurantInspectionID,
                        name: row.name,
                        seating_choice: row.seating_choice,
                        dist_meters: row.dist_meters
                    },
                    geometry: {
                        type: "Point",
                        coordinates: [row.long, row.lat]
                    }
                }))
            };
        }

        // Query nearby restaurants via the Supabase RPC function
        async function queryWithinDistance(point, n = 1000) {
            const { data, error } = await supabaseClient.rpc(
                "find_nearest_n_restaurants",
                {
                    lat: point[1],
                    lon: point[0],
                    n: n,
                }
            );

            if (error) {
                console.error("Error fetching nearest points:", error);
                return;
            }

            console.log("Nearest points fetched successfully:", data);
            const geojson = toGeoJSON(data);

            const source = map.getSource('nearby-restaurants');
            if (source) {
                source.setData(geojson);
            } else {
                map.addSource('nearby-restaurants', {
                    type: 'geojson',
                    data: geojson
                });

                map.addLayer({
                    id: 'nearby-restaurants-layer',
                    type: 'circle',
                    source: 'nearby-restaurants',
                    paint: {
                        // Color by seating_choice (the chosen variable)
                        'circle-color': [
                            'match',
                            ['get', 'seating_choice'],
                            'sidewalk', '#e63946',
                            'roadway', '#457b9d',
                            'both', '#2a9d8f',
                            /* other */ '#999999'
                        ],
                        // Size and opacity scale with distance from the clicked point:
                        // closer points are larger and more opaque, farther points shrink and fade
                        'circle-radius': [
                            'interpolate', ['linear'], ['get', 'dist_meters'],
                            0, 12,
                            1000, 4
                        ],
                        'circle-opacity': [
                            'interpolate', ['linear'], ['get', 'dist_meters'],
                            0, 0.95,
                            1000, 0.35
                        ],
                        'circle-stroke-width': 1,
                        'circle-stroke-color': '#1d1d1d'
                    }
                });

                // Popup on click
                map.on('click', 'nearby-restaurants-layer', (e) => {
                    const props = e.features[0].properties;
                    new maplibregl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(
                            `<strong>${props.name}</strong><br>
                             Seating: ${props.seating_choice}<br>
                             Distance: ${Math.round(props.dist_meters)} m`
                        )
                        .addTo(map);
                });

                map.on('mouseenter', 'nearby-restaurants-layer', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', 'nearby-restaurants-layer', () => {
                    map.getCanvas().style.cursor = '';
                });
            }
        }

        map.on('load', () => {
            console.log('Map loaded');

            map.on('click', (e) => {
                const point = [e.lngLat.lng, e.lngLat.lat];
                queryWithinDistance(point, 1000);
            });
        });
    </script>

</body>

</html>
