<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>IP Geolocation Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Create the map, centered roughly on the US, zoomed out
        const map = L.map('map').setView([39.8, -95.6], 4);

        // Add OpenStreetMap basemap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Load the GeoJSON file and add markers
        fetch('../outputs/ip_locations.geojson')
            .then(response => response.json())
            .then(data => {
                const geoLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 8,
                            fillColor: '#e63946',
                            color: '#1d1d1d',
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    },

                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            let popupContent = '<b>IP Geolocation</b><br>';
                            for (const key in feature.properties) {
                                let value = feature.properties[key];
                                // Truncate long values (like full request URLs) for display
                                if (typeof value === 'string' && value.length > 80) {
                                    value = value.substring(0, 80) + '…';
                                }
                                popupContent += `<b>${key}:</b> ${value}<br>`;
                            }
                            layer.bindPopup(popupContent);
                        }
                    }
                }).addTo(map);

                // Zoom the map to fit all the markers
                if (geoLayer.getBounds().isValid()) {
                    map.fitBounds(geoLayer.getBounds(), { maxZoom: 10 });
                }
            })
            .catch(err => {
                console.error('Error loading GeoJSON:', err);
                alert('Could not load ip_locations.geojson — check the file path and that you\'re using Live Server.');
            });
    </script>

</body>

</html>
